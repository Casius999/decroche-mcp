# Interview question bank — bilingual FR/EN, curated
# families: software, data, product, sales, generic
# kinds: behavioral, technical, case

software:
  behavioral:
    - text: "Décris une situation où tu as dû déboguer un problème critique en production. Comment as-tu procédé ?"
      rationale: "Évalue le calme sous pression et la démarche systématique"
    - text: "Parle-moi d'une fois où tu as dû refactoriser du code legacy. Quelle a été ton approche ?"
      rationale: "Évalue la gestion de la dette technique"
    - text: "Comment as-tu géré un désaccord technique fort avec un collègue ?"
      rationale: "Évalue la collaboration et la communication"
    - text: "Donne un exemple où tu as livré une fonctionnalité sous contrainte de temps forte. Qu'as-tu arbitré ?"
      rationale: "Évalue la priorisation et le jugement"
    - text: "Describe a time you had to debug a critical production issue. What was your process?"
      rationale: "Assesses composure under pressure and systematic thinking"
    - text: "Tell me about a time you improved code quality in a significant way. What drove the change?"
      rationale: "Assesses ownership and engineering standards"
    - text: "Give an example where you disagreed with a technical decision. How did you handle it?"
      rationale: "Assesses collaboration and communication"
  technical:
    - text: "Comment garantirais-tu la scalabilité d'un système qui doit traiter 10× le volume actuel ?"
      rationale: "Évalue la conception de systèmes distribués"
    - text: "Explique la différence entre cohérence forte et cohérence éventuelle. Quand choisir l'une ou l'autre ?"
      rationale: "Évalue la compréhension des trade-offs systèmes"
    - text: "Comment concevriez-vous un pipeline CI/CD pour un monorepo de 50 services ?"
      rationale: "Évalue la maturité DevOps"
    - text: "Explain the CAP theorem and give a practical example where it influenced a design decision."
      rationale: "Assesses distributed systems fundamentals"
    - text: "How would you design a rate-limiting system for a public API at scale?"
      rationale: "Assesses system design and scalability thinking"
    - text: "What is the difference between a process and a thread? When would you use one over the other?"
      rationale: "Assesses OS/concurrency fundamentals"
  case:
    - text: "Notre API de paiement a une latence P99 de 3 secondes. Comment diagnostiquerais-tu le problème ?"
      rationale: "Évalue la démarche de root-cause analysis"
    - text: "We're seeing a 10% increase in error rate since yesterday's deploy. Walk me through your investigation."
      rationale: "Assesses incident management and analytical thinking"
    - text: "Design a system to send 1 million push notifications within 5 minutes."
      rationale: "Assesses scalable architecture design"

data:
  behavioral:
    - text: "Raconte une situation où les données disponibles n'étaient pas fiables. Comment as-tu fait ?"
      rationale: "Évalue la rigueur et la gestion de l'incertitude"
    - text: "Donne un exemple où ton analyse a changé une décision produit ou business importante."
      rationale: "Évalue l'impact business de la data"
    - text: "Comment as-tu expliqué un résultat contre-intuitif à un stakeholder non technique ?"
      rationale: "Évalue la communication et la vulgarisation"
    - text: "Tell me about a time you had to work with incomplete or messy data. How did you handle it?"
      rationale: "Assesses data quality awareness and pragmatism"
    - text: "Describe a project where your analysis led to a significant business change."
      rationale: "Assesses impact and storytelling with data"
  technical:
    - text: "Quelle est la différence entre une requête OLAP et OLTP ? Quand utiliser un data warehouse ?"
      rationale: "Évalue la compréhension de l'infrastructure data"
    - text: "Explique le concept de window functions SQL et donne un exemple d'usage."
      rationale: "Évalue la maîtrise SQL avancée"
    - text: "How would you design a data pipeline that needs to be both real-time and batch?"
      rationale: "Assesses lambda/kappa architecture knowledge"
    - text: "What is the difference between precision and recall? When would you optimize for one over the other?"
      rationale: "Assesses ML evaluation fundamentals"
    - text: "Explain how you would handle class imbalance in a classification problem."
      rationale: "Assesses practical ML knowledge"
  case:
    - text: "Notre taux de conversion a baissé de 15% le mois dernier. Comment l'analysez-vous ?"
      rationale: "Évalue la démarche analytique structurée"
    - text: "A/B test shows a 2% uplift with p=0.04. The team wants to ship. What do you do?"
      rationale: "Assesses statistical thinking and practical judgment"

product:
  behavioral:
    - text: "Décris un cas où tu as dû prioriser des features avec des stakeholders aux avis divergents."
      rationale: "Évalue la priorisation et la gestion des parties prenantes"
    - text: "Parle-moi d'un produit que tu as lancé qui a échoué. Qu'as-tu appris ?"
      rationale: "Évalue l'ownership et la capacité d'apprentissage"
    - text: "Comment définirais-tu le succès pour ta prochaine feature ? Quelles métriques ?"
      rationale: "Évalue la culture data et la définition des KPIs"
    - text: "Tell me about a product decision you made with limited data. How did you proceed?"
      rationale: "Assesses judgment under uncertainty"
    - text: "Describe a time you had to say no to a stakeholder request. How did you handle it?"
      rationale: "Assesses prioritization and stakeholder communication"
  technical:
    - text: "What metrics would you define for a new user onboarding flow?"
      rationale: "Assesses product sense and metric definition"
    - text: "How do you decide between building a feature and buying/integrating a third-party solution?"
      rationale: "Assesses build vs buy trade-off thinking"
  case:
    - text: "Vous êtes PM sur notre appli mobile. Le DAU a baissé de 20% en 2 semaines. Que faites-vous ?"
      rationale: "Évalue la démarche diagnostique produit"
    - text: "Design a feature to improve retention for a B2C subscription app."
      rationale: "Assesses product thinking and retention understanding"
    - text: "How would you prioritize a backlog of 50 items with a team of 4 engineers for a 3-month quarter?"
      rationale: "Assesses prioritization frameworks and delivery planning"

sales:
  behavioral:
    - text: "Décris ta plus grande perte commerciale. Qu'as-tu retenu ?"
      rationale: "Évalue la résilience et l'apprentissage"
    - text: "Comment as-tu découvert un besoin client que le client lui-même n'avait pas identifié ?"
      rationale: "Évalue l'écoute active et la discovery"
    - text: "Parle-moi d'un cycle de vente complexe que tu as conduit de A à Z."
      rationale: "Évalue la gestion du cycle de vente long"
    - text: "Tell me about a time you had to turn around a deal that was about to be lost."
      rationale: "Assesses resilience and creative problem solving in sales"
    - text: "How do you handle a prospect who says your price is too high?"
      rationale: "Assesses objection handling and value selling"
  technical:
    - text: "Quel est ton processus de qualification d'un prospect (ex. MEDDIC ou BANT) ?"
      rationale: "Évalue la maîtrise des frameworks de qualification"
    - text: "How do you build and manage a pipeline to consistently hit quota?"
      rationale: "Assesses pipeline management discipline"
  case:
    - text: "Tu dois signer un client enterprise en 30 jours. Comment t'organises-tu ?"
      rationale: "Évalue la planification tactique en vente"
    - text: "A key account has gone dark for 3 weeks. How do you re-engage them?"
      rationale: "Assesses account management and re-engagement tactics"

generic:
  behavioral:
    - text: "Parle-moi de toi en 3 minutes."
      rationale: "Évalue la clarté du pitch personnel"
    - text: "Pourquoi ce poste et pourquoi cette entreprise ?"
      rationale: "Évalue la motivation et la préparation"
    - text: "Quelle est ta plus grande force professionnelle ? Donne un exemple concret."
      rationale: "Évalue la conscience de soi et l'illustration par les faits"
    - text: "Quelle est ta principale faiblesse et comment la travailles-tu ?"
      rationale: "Évalue l'honnêteté et le développement personnel"
    - text: "Où te vois-tu dans 3 ans ?"
      rationale: "Évalue l'ambition et la cohérence du projet professionnel"
    - text: "Tell me about yourself."
      rationale: "Assesses clarity of personal pitch"
    - text: "Why are you interested in this role and this company?"
      rationale: "Assesses motivation and preparation"
    - text: "What is your greatest professional achievement?"
      rationale: "Assesses ability to illustrate impact with facts"
    - text: "Describe a time you had to adapt quickly to a significant change."
      rationale: "Assesses adaptability and resilience"
    - text: "How do you prioritize when you have multiple competing deadlines?"
      rationale: "Assesses time management and organization"
  case:
    - text: "Combien de pizzas sont livrées à Paris chaque vendredi soir ? (estimation Fermi)"
      rationale: "Évalue la structuration d'une estimation quantitative"
    - text: "If you had to reduce costs in your current team by 20% without cutting headcount, what would you do?"
      rationale: "Assesses operational thinking and prioritization"
