# Fields:
#   provider  : greenhouse | lever | ashby | recruitee
#   token     : board token / company slug used in the provider API
#   company   : human-readable company name
#   sector    : (optional) industry sector
#   region    : (optional) primary hiring region
#   verified  : (optional) false = token not live-verified; omitted = assumed verified
#
# This is a SEED list — extend it with your own entries.
# Only well-known public boards are listed; uncertain tokens are flagged verified: false.

