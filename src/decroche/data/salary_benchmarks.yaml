# Salary benchmarks — sourced estimates for tech/product/data roles
# Sources:
#   APEC 2024: https://recruteurs.apec.fr/Emploi-cadre/Marche-de-l-emploi/Les-etudes-de-l-Apec/Remunerations-des-cadres
#     FR cadres median ~55k€ overall; tech cadres median ~52–62k€ by seniority
#   Levels.fyi 2024 (US/EU data): https://www.levels.fyi
#   Glassdoor FR 2024: aggregate salary surveys
#   Robert Half 2024 Tech Salary Guide (UK/CA): approximate ranges
# All figures are base salary in thousands of local currency (k).
# variable_pct: share of total comp that is variable (0.0–1.0).
# Figures are honest estimates — mark approximate:true when interpolated.

