# SBOM (syft: CycloneDX + SPDX) + SLSA build-provenance attestation (Sigstore keyless via OIDC).
# Runs on release publication. For SLSA Build Level 3, move the build into a reusable workflow.
name: SBOM & Attest

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  build-attest:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # OIDC -> keyless Sigstore signing
      contents: write # attach assets to the release
      attestations: write # record the attestation
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # --- Build Python distribution artifacts ---
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          enable-cache: true
      - name: Build distribution
        run: |
          uv build
          ls -l dist

      # --- SBOM: CycloneDX (vuln correlation) + SPDX (license/NTIA) ---
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      # --- Provenance attestation bound to the built artifacts (SLSA) ---
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "dist/*"

      # --- Attest the SBOMs too ---
      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: "dist/*"
          sbom-path: "sbom.cdx.json"

      - name: Attach SBOMs to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" sbom.cdx.json sbom.spdx.json --clobber

      # Consumers verify with:
      #   gh attestation verify <artifact> --owner Casius999
