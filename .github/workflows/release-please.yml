# Release automation via release-please (PR-gated, Conventional Commits -> SemVer + CHANGELOG).
# Merging the auto-maintained "release PR" tags the release and creates a GitHub Release, which
# then triggers sbom-attest.yml (on: release published). See references/release-automation.md.
# release-type = python (package: decroche).
name: Release Please

on:
  push:
    branches: ["main"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never cancel a release in flight

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create tags/releases + update CHANGELOG
      pull-requests: write # maintain the release PR
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: "python"
          # NOTE: the default GITHUB_TOKEN will NOT trigger downstream workflows (e.g. publish) on
          # the created tag. To chain them, supply a PAT or GitHub App token here:
          # token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
